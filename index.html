<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digitalt Kartarkiv</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #map { height: 100vh; width: 100%; }
        
        .top-action-buttons {
            position: absolute; top: 15px; right: 15px; z-index: 1001;
        }

        .top-btn {
            background: white; border: 2px solid #ff6600; color: #333;
            padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: bold;
            cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            transition: background 0.2s, transform 0.1s;
        }
        .top-btn:hover { background: #fff5ee; }
        .top-btn:active { transform: scale(0.97); }

        #filter-container {
            position: absolute; top: 55px; right: 15px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); border-left: 5px solid #ff6600;
            display: flex; flex-direction: column; gap: 10px; width: 260px;
            box-sizing: border-box;
            max-height: calc(100vh - 75px);
            overflow-y: auto;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .filter-hidden { display: none !important; }

        .filter-group { display: flex; flex-direction: column; }
        .filter-group label { font-weight: bold; font-size: 13px; margin-bottom: 3px; }

        #name-search, #year-filter, #organizer-filter { 
            width: 100%; padding: 6px; border-radius: 4px; 
            border: 1px solid #ccc; box-sizing: border-box; font-size: 13px; 
        }

        .result-count {
            font-size: 12px;
            color: #555;
            font-weight: bold;
            padding-top: 6px;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .inner-stats-btn {
            background: #ff6600; color: white; border: none;
            padding: 4px 8px; border-radius: 4px; font-size: 11px;
            cursor: pointer; font-weight: bold;
        }
        .inner-stats-btn:hover { background: #e05500; }

        #stats-box {
            background: #fff8f5; border: 1px solid #ffd8c2;
            padding: 10px; border-radius: 6px; font-size: 12px;
            margin-top: 5px; color: #333;
        }
        #stats-box h4 { margin: 0 0 6px 0; font-size: 13px; color: #ff6600; }
        #stats-box ul { margin: 0; padding-left: 15px; }
        #stats-box li { margin-bottom: 4px; }

        .admin-coord-display {
            position: absolute; bottom: 25px; left: 20px;
            background: rgba(255, 255, 255, 0.95); padding: 12px; z-index: 1000;
            border: 2px solid #ff6600; border-radius: 8px; font-size: 13px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2); min-width: 210px;
        }

        .coord-row {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 5px; font-size: 12px;
        }

        .coord-btn {
            padding: 2px 6px; border: 1px solid #ccc; background: #f0f0f0;
            border-radius: 3px; cursor: pointer; font-size: 11px;
        }
        .coord-btn:hover { background: #e0e0e0; }

        .ol-popup { min-width: 280px; }
        .ol-popup h3 { margin: 0 0 2px 0; color: #333; font-size: 18px; }
        .ol-popup p.meta { margin: 0 0 12px 0; font-size: 12px; color: #666; border-bottom: 1px solid #eee; padding-bottom: 6px; }
        
        .btn-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
        .btn {
            display: block; text-align: center; padding: 10px;
            border-radius: 4px; text-decoration: none; color: white;
            font-weight: bold; font-size: 13px; transition: background 0.2s;
        }
        .btn-pdf { background-color: #e74c3c; }
        .btn-winsplits { background-color: #3498db; }
        .btn-livelox { background-color: #2ecc71; }
        .btn:hover { filter: brightness(90%); }

        .btn-disabled {
            background-color: #bdc3c7 !important;
            color: #7f8c8d !important;
            cursor: not-allowed !important;
            pointer-events: none !important;
            user-select: none !important;
            box-shadow: none !important;
        }

        .referat-box {
            max-height: 200px; overflow-y: auto; background: #fdf6f2;
            padding: 12px; border: 1px solid #f0e0d5; border-radius: 4px;
            font-size: 13px; line-height: 1.5; color: #444; white-space: pre-wrap;
        }

        .ol-icon {
            background: transparent !important; border: none !important; overflow: visible !important;
        }

        .ol-icon-inner {
            width: 20px; height: 20px;
            background: linear-gradient(135deg, #ffffff 50%, #ff6600 50%);
            border: 1.5px solid #333; box-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .ol-icon-year {
            position: absolute; top: 23px; left: 50%;
            transform: translateX(-50%); background: white;
            border: 1px solid #333; border-radius: 3px;
            padding: 1px 4px; font-size: 10px; font-weight: bold;
            color: #333; white-space: nowrap;
            box-shadow: 1px 1px 3px rgba(0,0,0,0.25); z-index: 1000;
        }

        .marker-cluster-small, .marker-cluster-medium, .marker-cluster-large {
            background-color: rgba(255, 102, 0, 0.6);
        }
        .marker-cluster-small div, .marker-cluster-medium div, .marker-cluster-large div {
            background-color: rgba(255, 102, 0, 0.8); color: white; font-weight: bold;
        }

        @media (max-width: 600px) {
            .admin-coord-display { bottom: 10px; left: 10px; right: 10px; font-size: 11px; }
        }
    </style>
</head>
<body>

    <div class="top-action-buttons">
        <button id="toggle-filter-btn" class="top-btn" onclick="toggleFilterMenu()">🔍 Filtrera kartor</button>
    </div>

    <div id="filter-container" class="filter-hidden">
        <div class="filter-group">
            <label for="name-search">Sök tävling:</label>
            <input type="text" id="name-search" placeholder="T.ex. O-Ringen..." oninput="onFilterChange('search')">
        </div>
        <div class="filter-group">
            <label for="year-filter">Välj år:</label>
            <select id="year-filter" onchange="onFilterChange('year')">
                <option value="all">Alla år</option>
            </select>
        </div>
        <div class="filter-group">
            <label for="organizer-filter">Välj arrangör:</label>
            <select id="organizer-filter" onchange="onFilterChange('organizer')">
                <option value="all">Alla arrangörer</option>
            </select>
        </div>
        
        <div class="result-count">
            <span>Visar <strong id="count-number">0</strong> kartor</span>
            <button class="inner-stats-btn" onclick="toggleStats()">📊 Visa statistik</button>
        </div>

        <div id="stats-box" style="display: none;">
            <h4>Statistik för urvalet</h4>
            <ul>
                <li>Total sträcka: <strong id="stat-dist">0</strong> km</li>
                <li>Total tid: <strong id="stat-total-time">-</strong></li>
                <li>Längsta bana: <strong id="stat-max-dist">-</strong></li>
                <li>Längsta tid: <strong id="stat-max-time">-</strong></li>
                <li>Årsspann: <strong id="stat-years">-</strong></li>
                <li>Arrangörer: <strong id="stat-orgs">0</strong> st</li>
            </ul>
        </div>
    </div>

    <div id="map"></div>
    
    <div class="admin-coord-display" id="coords">
        Klicka på kartan för koordinater
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.js"></script>
    
    <script>
        const csvBaseUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTiIvWU6vJ_oiLei4yVUVRjROhqhDOUVxE5H796BTNBHbRRXz6tgMtL777NatJMlHkyF1oXKknvMEDk/pub?output=csv';
        const csvUrl = csvBaseUrl + '&t=' + new Date().getTime();

        const map = L.map('map').setView([62.0, 15.0], 5);
        
        const cartoLight = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap, © CARTO'
        });
        const osmStandard = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap-bidragsgivare'
        });
        const esriSatellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles © Esri'
        });

        osmStandard.addTo(map);

        L.control.layers({
            "Gatukarta": osmStandard,
            "Ljus karta": cartoLight,
            "Satellit": esriSatellite
        }, null, { position: 'topleft' }).addTo(map);

        const markersGroup = L.markerClusterGroup({
            showCoverageOnHover: false,
            spiderfyOnMaxZoom: true,
            disableClusteringAtZoom: 17
        });

        function toggleFilterMenu() {
            const container = document.getElementById('filter-container');
            const btn = document.getElementById('toggle-filter-btn');
            
            container.classList.toggle('filter-hidden');
            btn.innerHTML = container.classList.contains('filter-hidden') ? '🔍 Filtrera kartor' : '✕ Stäng filter';
        }

        function toggleStats() {
            const statsBox = document.getElementById('stats-box');
            statsBox.style.display = (statsBox.style.display === 'none') ? 'block' : 'none';
        }

        function createYearIcon(year) {
            return L.divIcon({
                className: 'ol-icon',
                html: `<div class="ol-icon-inner"></div><div class="ol-icon-year">${year || ''}</div>`,
                iconSize: [20, 20], iconAnchor: [10, 10]
            });
        }

        function getButtonHtml(url, label, activeClass) {
            const cleanUrl = url ? String(url).trim() : "";
            const hasValidUrl = cleanUrl.startsWith("http://") || cleanUrl.startsWith("https://");

            if (hasValidUrl) {
                return `<a href="${cleanUrl}" target="_blank" class="btn ${activeClass}">${label}</a>`;
            } else {
                return `<span class="btn btn-disabled">${label} (saknas)</span>`;
            }
        }

        function parseCoord(val) {
            if (!val) return NaN;
            const cleanStr = String(val).replace(',', '.').replace(/[^0-9.-]/g, '');
            return parseFloat(cleanStr);
        }

        function parseTimeToSeconds(tidStr) {
            if (!tidStr) return 0;
            const parts = String(tidStr).trim().split(':').map(p => parseInt(p, 10));
            if (parts.some(isNaN)) return 0;
            
            if (parts.length === 3) {
                return parts[0] * 3600 + parts[1] * 60 + parts[2];
            } else if (parts.length === 2) {
                return parts[0] * 60 + parts[1];
            } else if (parts.length === 1) {
                return parts[0] * 60;
            }
            return 0;
        }

        function formatSecondsToTime(totalSec) {
            if (!totalSec || totalSec <= 0) return "-";
            const hours = Math.floor(totalSec / 3600);
            const minutes = Math.floor((totalSec % 3600) / 60);
            const seconds = totalSec % 60;

            if (hours > 0) {
                return `${hours}t ${minutes}m`;
            }
            return `${minutes}m ${seconds}s`;
        }

        let allItemsList = [];

        function getValueFromRow(row, possibleKeys) {
            for (let key of possibleKeys) {
                if (row[key] !== undefined) return row[key];
                // Sök även fallobroende (case-insensitive)
                const foundKey = Object.keys(row).find(k => k.trim().toLowerCase() === key.toLowerCase());
                if (foundKey && row[foundKey] !== undefined) return row[foundKey];
            }
            return "";
        }

        async function loadData() {
            Papa.parse(csvUrl, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    allItemsList = [];

                    if (!results.data || results.data.length === 0) {
                        console.error("Ingen data hittades i CSV-filen.");
                        return;
                    }

                    results.data.forEach(row => {
                        const namnVal = getValueFromRow(row, ["Namn", "namn"]);
                        const arVal = getValueFromRow(row, ["År", "Ar", "ar", "year"]);
                        const orgVal = getValueFromRow(row, ["Arrangör", "Arrangor", "arrangor", "organizer"]);
                        const langdVal = getValueFromRow(row, ["Längd_m", "Langd_m", "Längd", "langd"]);
                        const tidVal = getValueFromRow(row, ["Tid", "tid"]);
                        const latVal = getValueFromRow(row, ["Latitud", "latitud", "Lat", "lat"]);
                        const lngVal = getValueFromRow(row, ["Longitud", "longitud", "Lng", "lng", "Lon", "lon"]);
                        const refVal = getValueFromRow(row, ["Referat", "referat"]);
                        const pdfVal = getValueFromRow(row, ["PDF_URL", "pdf_url", "PDF"]);
                        const splitVal = getValueFromRow(row, ["Splits_URL", "splits_url", "Splits"]);
                        const routeVal = getValueFromRow(row, ["Route_URL", "route_url", "Livelox"]);

                        const item = {
                            namn: namnVal || "",
                            ar: parseInt(arVal, 10),
                            arrangor: String(orgVal || "").trim(),
                            langd: parseCoord(langdVal) || 0,
                            tid: tidVal || "",
                            tidSekunder: parseTimeToSeconds(tidVal),
                            lat: parseCoord(latVal),
                            lng: parseCoord(lngVal),
                            referat: refVal || "Inget referat skrivet.",
                            pdf: pdfVal,
                            winsplits: splitVal,
                            livelox: routeVal
                        };

                        if (!isNaN(item.lat) && !isNaN(item.lng)) {
                            const marker = L.marker([item.lat, item.lng], { icon: createYearIcon(item.ar) });
                            
                            const popupContent = `
                                <div class="ol-popup">
                                    <h3>${item.namn}</h3>
                                    <p class="meta">
                                        <strong>${item.ar || ''}</strong> | ${item.arrangor} | ${item.langd}m ${item.tid ? '| ' + item.tid : ''}
                                    </p>
                                    <div class="btn-group">
                                        ${getButtonHtml(item.pdf, 'Karta (PDF)', 'btn-pdf')}
                                        ${getButtonHtml(item.winsplits, 'Split Times', 'btn-winsplits')}
                                        ${getButtonHtml(item.livelox, 'Route', 'btn-livelox')}
                                    </div>
                                    <div class="referat-box">${item.referat}</div>
                                </div>
                            `;
                            
                            marker.bindPopup(popupContent, { maxWidth: 350 });
                            marker.year = String(item.ar);
                            marker.arrangor = String(item.arrangor);
                            marker.namn = String(item.namn);
                            marker.langd = item.langd;
                            marker.tid = item.tid;
                            marker.tidSekunder = item.tidSekunder;
                            
                            item.marker = marker;
                            allItemsList.push(item);
                        }
                    });

                    map.addLayer(markersGroup);
                    initFilterOptions();
                    filterMarkers();
                },
                error: function(err) {
                    console.error("Fel vid laddning av CSV:", err);
                }
            });
        }

        function initFilterOptions() {
            const yearSelect = document.getElementById('year-filter');
            const orgSelect = document.getElementById('organizer-filter');

            if (!yearSelect || !orgSelect) return;

            const allYears = new Set();
            const allOrgs = new Set();

            allItemsList.forEach(item => {
                if (item.ar && !isNaN(item.ar)) allYears.add(item.ar);
                if (item.arrangor) allOrgs.add(item.arrangor);
            });

            yearSelect.innerHTML = '<option value="all">Alla år</option>';
            Array.from(allYears).sort((a, b) => b - a).forEach(year => {
                const opt = document.createElement('option');
                opt.value = String(year);
                opt.textContent = year;
                yearSelect.appendChild(opt);
            });

            orgSelect.innerHTML = '<option value="all">Alla arrangörer</option>';
            Array.from(allOrgs).sort((a, b) => a.localeCompare(b, 'sv')).forEach(org => {
                const opt = document.createElement('option');
                opt.value = org;
                opt.textContent = org;
                orgSelect.appendChild(opt);
            });
        }

        function updateDropdowns(source) {
            const yearSelect = document.getElementById('year-filter');
            const orgSelect = document.getElementById('organizer-filter');

            if (!yearSelect || !orgSelect) return;

            const selectedYear = yearSelect.value;
            const selectedOrg = orgSelect.value;

            if (source === 'year') {
                const availableOrgs = new Set();
                allItemsList.forEach(item => {
                    if (selectedYear === "all" || String(item.ar) === selectedYear) {
                        if (item.arrangor) availableOrgs.add(item.arrangor);
                    }
                });

                orgSelect.innerHTML = '<option value="all">Alla arrangörer</option>';
                Array.from(availableOrgs).sort((a, b) => a.localeCompare(b, 'sv')).forEach(org => {
                    const opt = document.createElement('option');
                    opt.value = org;
                    opt.textContent = org;
                    if (org === selectedOrg) opt.selected = true;
                    orgSelect.appendChild(opt);
                });
            } else if (source === 'organizer') {
                const availableYears = new Set();
                allItemsList.forEach(item => {
                    if (selectedOrg === "all" || item.arrangor === selectedOrg) {
                        if (item.ar && !isNaN(item.ar)) availableYears.add(item.ar);
                    }
                });

                yearSelect.innerHTML = '<option value="all">Alla år</option>';
                Array.from(availableYears).sort((a, b) => b - a).forEach(year => {
                    const opt = document.createElement('option');
                    opt.value = String(year);
                    opt.textContent = year;
                    if (String(year) === selectedYear) opt.selected = true;
                    yearSelect.appendChild(opt);
                });
            }
        }

        function onFilterChange(source) {
            updateDropdowns(source);
            filterMarkers();
        }

        function filterMarkers(autoZoom = true) {
            const yearSelect = document.getElementById('year-filter');
            const orgSelect = document.getElementById('organizer-filter');
            const searchInput = document.getElementById('name-search');

            const selectedYear = yearSelect ? yearSelect.value : "all";
            const selectedOrganizer = orgSelect ? orgSelect.value : "all";
            const searchText = searchInput ? searchInput.value.toLowerCase().trim() : "";
            
            markersGroup.clearLayers();
            let visibleCount = 0;
            let totalMeters = 0;
            let totalSeconds = 0;
            
            let maxDistItem = null;
            let maxTimeItem = null;

            const visibleYears = [];
            const visibleOrgs = new Set();
            
            allItemsList.forEach(item => {
                const matchesYear = (selectedYear === "all" || String(item.ar) === selectedYear);
                const matchesOrganizer = (selectedOrganizer === "all" || item.arrangor === selectedOrganizer);
                const matchesSearch = (searchText === "" || item.namn.toLowerCase().includes(searchText));

                if (matchesYear && matchesOrganizer && matchesSearch) {
                    markersGroup.addLayer(item.marker);
                    visibleCount++;

                    if (item.langd) {
                        totalMeters += item.langd;
                        if (!maxDistItem || item.langd > maxDistItem.langd) {
                            maxDistItem = item;
                        }
                    }

                    if (item.tidSekunder) {
                        totalSeconds += item.tidSekunder;
                        if (!maxTimeItem || item.tidSekunder > maxTimeItem.tidSekunder) {
                            maxTimeItem = item;
                        }
                    }

                    if (item.ar && !isNaN(item.ar)) visibleYears.push(item.ar);
                    if (item.arrangor) visibleOrgs.add(item.arrangor);
                }
            });

            const countElem = document.getElementById('count-number');
            if (countElem) countElem.textContent = visibleCount;

            const statDist = document.getElementById('stat-dist');
            if (statDist) statDist.textContent = (totalMeters / 1000).toFixed(1);

            const statTime = document.getElementById('stat-total-time');
            if (statTime) statTime.textContent = formatSecondsToTime(totalSeconds);
            
            const statMaxDist = document.getElementById('stat-max-dist');
            if (statMaxDist) {
                if (maxDistItem) {
                    const distKm = (maxDistItem.langd / 1000).toFixed(2);
                    statMaxDist.textContent = `${distKm} km (${maxDistItem.namn})`;
                } else {
                    statMaxDist.textContent = '-';
                }
            }

            const statMaxTime = document.getElementById('stat-max-time');
            if (statMaxTime) {
                if (maxTimeItem) {
                    statMaxTime.textContent = `${maxTimeItem.tid} (${maxTimeItem.namn})`;
                } else {
                    statMaxTime.textContent = '-';
                }
            }

            const statOrgs = document.getElementById('stat-orgs');
            if (statOrgs) statOrgs.textContent = visibleOrgs.size;
            
            const statYears = document.getElementById('stat-years');
            if (statYears) {
                if (visibleYears.length > 0) {
                    const minYear = Math.min(...visibleYears);
                    const maxYear = Math.max(...visibleYears);
                    statYears.textContent = minYear === maxYear ? minYear : `${minYear} - ${maxYear}`;
                } else {
                    statYears.textContent = '-';
                }
            }

            if (visibleCount > 0 && autoZoom) {
                try {
                    map.fitBounds(markersGroup.getBounds(), {
                        padding: [60, 60],
                        maxZoom: 13,
                        animate: true,
                        duration: 0.8
                    });
                } catch(e) {
                    console.warn("Kunde inte anpassa kartvy:", e);
                }
            }
        }

        /* --- Admin-verktyg för koordinater --- */
        let adminMarker = null;

        function clearAdminMarker() {
            if (adminMarker) {
                map.removeLayer(adminMarker);
                adminMarker = null;
            }
            document.getElementById('coords').innerHTML = 'Klicka på kartan för koordinater';
        }

        map.on('click', function(e) {
            const lat = e.latlng.lat.toFixed(6);
            const lng = e.latlng.lng.toFixed(6);

            if (adminMarker) {
                adminMarker.setLatLng(e.latlng);
            } else {
                adminMarker = L.circleMarker(e.latlng, {
                    color: '#ff0000',
                    fillColor: '#ff6600',
                    fillOpacity: 0.8,
                    radius: 8,
                    weight: 3
                }).addTo(map);
            }

            document.getElementById('coords').innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                    <strong>Admin-koordinater:</strong>
                    <button class="coord-btn" onclick="clearAdminMarker()" style="color: #c0392b; font-weight: bold;">✕ Rensa</button>
                </div>
                <div class="coord-row">
                    <span>Lat: <code>${lat}</code></span>
                    <button class="coord-btn" onclick="navigator.clipboard.writeText('${lat}'); this.innerText='Kopierat!';">Kopiera Lat</button>
                </div>
                <div class="coord-row">
                    <span>Long: <code>${lng}</code></span>
                    <button class="coord-btn" onclick="navigator.clipboard.writeText('${lng}'); this.innerText='Kopierat!';">Kopiera Lng</button>
                </div>
            `;
        });

        loadData();
    </script>
</body>
</html>
