<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digitalt Kartarkiv</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #map { height: 100vh; width: 100%; }
        
        /* Filter-menyn */
        #filter-container {
            position: absolute; top: 15px; right: 15px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); border-left: 5px solid #ff6600;
            display: flex; flex-direction: column; gap: 10px; width: 220px;
        }

        .filter-group { display: flex; flex-direction: column; }
        .filter-group label { font-weight: bold; font-size: 13px; margin-bottom: 3px; }

        #name-search, #year-filter, #organizer-filter { 
            width: 100%; padding: 6px; border-radius: 4px; 
            border: 1px solid #ccc; box-sizing: border-box; font-size: 13px; 
        }

        /* Räknare för träffar */
        .result-count {
            font-size: 12px;
            color: #555;
            font-weight: bold;
            padding-top: 4px;
            border-top: 1px solid #eee;
        }

        /* Animerad tidslinjespelare längst ner */
        #timeline-container {
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
            z-index: 1000; background: rgba(255, 255, 255, 0.95);
            padding: 10px 20px; border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); border: 2px solid #ff6600;
            display: flex; align-items: center; gap: 15px; min-width: 320px;
        }

        .timeline-btn {
            background: #ff6600; color: white; border: none;
            width: 36px; height: 36px; border-radius: 50%;
            font-size: 14px; cursor: pointer; display: flex;
            align-items: center; justify-content: center;
            transition: background 0.2s, transform 0.1s;
        }
        .timeline-btn:hover { background: #e05500; transform: scale(1.05); }

        .timeline-slider {
            flex-grow: 1; accent-color: #ff6600; cursor: pointer;
        }

        .timeline-label {
            font-weight: bold; font-size: 14px; color: #333;
            min-width: 65px; text-align: right;
        }

        /* Koordinatvisning för admin */
        .admin-coord-display {
            position: absolute; bottom: 25px; left: 20px;
            background: rgba(255, 255, 255, 0.95); padding: 12px; z-index: 1000;
            border: 2px solid #ff6600; border-radius: 8px; font-size: 13px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* Popup styling */
        .ol-popup { min-width: 280px; }
        .ol-popup h3 { margin: 0 0 2px 0; color: #333; font-size: 18px; }
        .ol-popup p.meta { margin: 0 0 12px 0; font-size: 12px; color: #666; border-bottom: 1px solid #eee; padding-bottom: 6px; }
        
        .btn-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
        .btn {
            display: block; text-align: center; padding: 10px;
            border-radius: 4px; text-decoration: none; color: white;
            font-weight: bold; font-size: 13px; transition: background 0.2s;
        }
        .btn-pdf { background-color: #e74c3c; }
        .btn-winsplits { background-color: #3498db; }
        .btn-livelox { background-color: #2ecc71; }
        .btn:hover { filter: brightness(90%); }

        .btn-disabled {
            background-color: #bdc3c7 !important;
            color: #7f8c8d !important;
            cursor: not-allowed !important;
            pointer-events: none !important;
            user-select: none !important;
            box-shadow: none !important;
        }

        .referat-box {
            max-height: 200px; overflow-y: auto; background: #fdf6f2;
            padding: 12px; border: 1px solid #f0e0d5; border-radius: 4px;
            font-size: 13px; line-height: 1.5; color: #444; white-space: pre-wrap;
        }

        .ol-icon {
            background: transparent !important; border: none !important; overflow: visible !important;
        }

        .ol-icon-inner {
            width: 20px; height: 20px;
            background: linear-gradient(135deg, #ffffff 50%, #ff6600 50%);
            border: 1.5px solid #333; box-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .ol-icon-year {
            position: absolute; top: 23px; left: 50%;
            transform: translateX(-50%); background: white;
            border: 1px solid #333; border-radius: 3px;
            padding: 1px 4px; font-size: 10px; font-weight: bold;
            color: #333; white-space: nowrap;
            box-shadow: 1px 1px 3px rgba(0,0,0,0.25); z-index: 1000;
        }

        .marker-cluster-small, .marker-cluster-medium, .marker-cluster-large {
            background-color: rgba(255, 102, 0, 0.6);
        }
        .marker-cluster-small div, .marker-cluster-medium div, .marker-cluster-large div {
            background-color: rgba(255, 102, 0, 0.8); color: white; font-weight: bold;
        }

        @media (max-width: 600px) {
            #timeline-container { width: 85%; bottom: 15px; }
            .admin-coord-display { display: none; }
        }
    </style>
</head>
<body>

    <div id="filter-container">
        <div class="filter-group">
            <label for="name-search">Sök tävling:</label>
            <input type="text" id="name-search" placeholder="T.ex. O-Ringen..." oninput="filterMarkers()">
        </div>
        <div class="filter-group">
            <label for="year-filter">Välj år:</label>
            <select id="year-filter" onchange="syncTimelineFromDropdown()">
                <option value="all">Alla år</option>
            </select>
        </div>
        <div class="filter-group">
            <label for="organizer-filter">Välj arrangör:</label>
            <select id="organizer-filter" onchange="filterMarkers()">
                <option value="all">Alla arrangörer</option>
            </select>
        </div>
        <div class="result-count">
            Visar <span id="count-number">0</span> kartor
        </div>
    </div>

    <!-- Tidslinjespelare -->
    <div id="timeline-container">
        <button id="play-btn" class="timeline-btn" onclick="togglePlayPause()">▶</button>
        <input type="range" id="timeline-slider" class="timeline-slider" min="2000" max="2026" value="2026" oninput="onSliderChange()">
        <span id="timeline-year-label" class="timeline-label">Alla år</span>
    </div>

    <div id="map"></div>
    
    <div class="admin-coord-display" id="coords">
        Klicka på kartan för koordinater
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    
    <script>
        const csvBaseUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTiIvWU6vJ_oiLei4yVUVRjROhqhDOUVxE5H796BTNBHbRRXz6tgMtL777NatJMlHkyF1oXKknvMEDk/pub?output=csv';
        const csvUrl = csvBaseUrl + '&t=' + new Date().getTime();

        const map = L.map('map').setView([62.0, 15.0], 5);
        
        const cartoLight = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap, © CARTO'
        });
        const osmStandard = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap-bidragsgivare'
        });
        const esriSatellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles © Esri'
        });

        osmStandard.addTo(map);

        L.control.layers({
            "Ljus karta": cartoLight,
            "Gatukarta": osmStandard,
            "Satellit": esriSatellite
        }, null, { position: 'topleft' }).addTo(map);

        const markersGroup = L.markerClusterGroup({
            showCoverageOnHover: false,
            spiderfyOnMaxZoom: true,
            disableClusteringAtZoom: 17
        });

        function createYearIcon(year) {
            return L.divIcon({
                className: 'ol-icon',
                html: `<div class="ol-icon-inner"></div><div class="ol-icon-year">${year || ''}</div>`,
                iconSize: [20, 20], iconAnchor: [10, 10]
            });
        }

        function getButtonHtml(url, label, activeClass) {
            const cleanUrl = url ? String(url).trim() : "";
            const hasValidUrl = cleanUrl.startsWith("http://") || cleanUrl.startsWith("https://");

            if (hasValidUrl) {
                return `<a href="${cleanUrl}" target="_blank" class="btn ${activeClass}">${label}</a>`;
            } else {
                return `<span class="btn btn-disabled">${label} (saknas)</span>`;
            }
        }

        let allMarkersList = [];
        let sortedYearsList = [];
        let isPlaying = false;
        let playTimer = null;

        async function loadData() {
            Papa.parse(csvUrl, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    const yearFilterMenu = document.getElementById('year-filter');
                    const organizerFilterMenu = document.getElementById('organizer-filter');
                    const yearsFound = new Set();
                    const organizersFound = new Set();

                    results.data.forEach(row => {
                        const item = {
                            namn: row["Namn"] || "",
                            ar: parseInt(row["År"], 10),
                            arrangor: row["Arrangör"] || "",
                            langd: row["Längd_m"],
                            tid: row["Tid"] || "",
                            lat: parseFloat(String(row["Latitud"]).replace(',', '.')),
                            lng: parseFloat(String(row["Longitud"]).replace(',', '.')),
                            referat: row["Referat"] || "Inget referat skrivet.",
                            pdf: row["PDF_URL"],
                            winsplits: row["Splits_URL"],
                            livelox: row["Route_URL"]
                        };

                        if (!isNaN(item.lat) && !isNaN(item.lng)) {
                            const marker = L.marker([item.lat, item.lng], { icon: createYearIcon(item.ar) });
                            
                            const popupContent = `
                                <div class="ol-popup">
                                    <h3>${item.namn}</h3>
                                    <p class="meta">
                                        <strong>${item.ar || ''}</strong> | ${item.arrangor} | ${item.langd}m ${item.tid ? '| ' + item.tid : ''}
                                    </p>
                                    <div class="btn-group">
                                        ${getButtonHtml(item.pdf, 'Karta (PDF)', 'btn-pdf')}
                                        ${getButtonHtml(item.winsplits, 'Split Times', 'btn-winsplits')}
                                        ${getButtonHtml(item.livelox, 'Route', 'btn-livelox')}
                                    </div>
                                    <div class="referat-box">${item.referat}</div>
                                </div>
                            `;
                            
                            marker.bindPopup(popupContent, { maxWidth: 350 });
                            marker.year = String(item.ar);
                            marker.arrangor = String(item.arrangor);
                            marker.namn = String(item.namn).toLowerCase();
                            
                            allMarkersList.push(marker);
                            if(item.ar && !isNaN(item.ar)) yearsFound.add(item.ar);
                            if(item.arrangor.trim()) organizersFound.add(item.arrangor.trim());
                        }
                    });

                    sortedYearsList = Array.from(yearsFound).sort((a, b) => a - b);

                    if (sortedYearsList.length > 0) {
                        const slider = document.getElementById('timeline-slider');
                        slider.min = 0;
                        slider.max = sortedYearsList.length;
                        slider.value = sortedYearsList.length;
                    }

                    [...sortedYearsList].reverse().forEach(year => {
                        const opt = document.createElement('option');
                        opt.value = year; opt.innerHTML = year;
                        yearFilterMenu.appendChild(opt);
                    });

                    Array.from(organizersFound).sort((a, b) => a.localeCompare(b, 'sv')).forEach(org => {
                        const opt = document.createElement('option');
                        opt.value = org; opt.innerHTML = org;
                        organizerFilterMenu.appendChild(opt);
                    });

                    map.addLayer(markersGroup);
                    filterMarkers();
                }
            });
        }

        function filterMarkers(autoZoom = true) {
            const selectedYear = document.getElementById('year-filter').value;
            const selectedOrganizer = document.getElementById('organizer-filter').value;
            const searchText = document.getElementById('name-search').value.toLowerCase().trim();
            
            markersGroup.clearLayers();
            let visibleCount = 0;
            
            allMarkersList.forEach(marker => {
                const matchesYear = (selectedYear === "all" || marker.year === selectedYear);
                const matchesOrganizer = (selectedOrganizer === "all" || marker.arrangor === selectedOrganizer);
                const matchesSearch = (searchText === "" || marker.namn.includes(searchText));

                if (matchesYear && matchesOrganizer && matchesSearch) {
                    markersGroup.addLayer(marker);
                    visibleCount++;
                }
            });

            document.getElementById('count-number').textContent = visibleCount;

            if (visibleCount > 0 && autoZoom) {
                map.fitBounds(markersGroup.getBounds(), {
                    padding: [60, 60],
                    maxZoom: 13,
                    animate: true,
                    duration: 0.8
                });
            }
        }

        function onSliderChange() {
            const slider = document.getElementById('timeline-slider');
            const val = parseInt(slider.value, 10);
            const yearLabel = document.getElementById('timeline-year-label');
            const yearSelect = document.getElementById('year-filter');

            if (val >= sortedYearsList.length) {
                yearSelect.value = "all";
                yearLabel.textContent = "Alla år";
            } else {
                const year = String(sortedYearsList[val]);
                yearSelect.value = year;
                yearLabel.textContent = year;
            }

            filterMarkers(true);
        }

        function syncTimelineFromDropdown() {
            const selectedYear = document.getElementById('year-filter').value;
            const slider = document.getElementById('timeline-slider');
            const yearLabel = document.getElementById('timeline-year-label');

            if (selectedYear === "all") {
                slider.value = sortedYearsList.length;
                yearLabel.textContent = "Alla år";
            } else {
                const idx = sortedYearsList.indexOf(parseInt(selectedYear, 10));
                if (idx !== -1) {
                    slider.value = idx;
                    yearLabel.textContent = selectedYear;
                }
            }
            filterMarkers(true);
        }

        function togglePlayPause() {
            if (isPlaying) {
                stopPlayback();
            } else {
                startPlayback();
            }
        }

        function startPlayback() {
            const slider = document.getElementById('timeline-slider');
            if (parseInt(slider.value, 10) >= sortedYearsList.length) {
                slider.value = 0;
            }
            isPlaying = true;
            document.getElementById('play-btn').innerHTML = '⏸';
            
            onSliderChange();

            playTimer = setInterval(() => {
                let currentVal = parseInt(slider.value, 10);
                if (currentVal < sortedYearsList.length - 1) {
                    slider.value = currentVal + 1;
                    onSliderChange();
                } else {
                    slider.value = sortedYearsList.length;
                    onSliderChange();
                    stopPlayback();
                }
            }, 1800);
        }

        function stopPlayback() {
            isPlaying = false;
            clearInterval(playTimer);
            document.getElementById('play-btn').innerHTML = '▶';
        }

        map.on('click', function(e) {
            document.getElementById('coords').innerHTML = 
                `<strong>Admin-koordinater:</strong><br>Lat: ${e.latlng.lat.toFixed(6)}<br>Long: ${e.latlng.lng.toFixed(6)}`;
        });

        loadData();
    </script>
</body>
</html>
