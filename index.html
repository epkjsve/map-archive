<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digitalt Kartarkiv</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #map { height: 100vh; width: 100%; }
        
        /* Filter-menyn */
        #filter-container {
            position: absolute; top: 15px; right: 15px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); border-left: 5px solid #ff6600;
            display: flex; flex-direction: column; gap: 10px; width: 220px;
        }

        .filter-group { display: flex; flex-direction: column; }
        .filter-group label { font-weight: bold; font-size: 13px; margin-bottom: 3px; }

        #name-search, #year-filter, #organizer-filter { 
            width: 100%; padding: 6px; border-radius: 4px; 
            border: 1px solid #ccc; box-sizing: border-box; font-size: 13px; 
        }

        .stats-btn {
            background: #ff6600; color: white; border: none; padding: 8px 12px;
            border-radius: 4px; font-weight: bold; font-size: 13px; cursor: pointer;
            transition: background 0.2s; text-align: center; margin-top: 5px;
        }
        .stats-btn:hover { background: #e05500; }

        /* Räknare för träffar */
        .result-count {
            font-size: 12px;
            color: #555;
            font-weight: bold;
            padding-top: 4px;
            border-top: 1px solid #eee;
        }

        /* Modal för statistik */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.5); z-index: 2000; display: none;
            justify-content: center; align-items: center;
        }

        .modal-content {
            background: white; padding: 25px; border-radius: 12px;
            width: 90%; max-width: 750px; max-height: 85vh; overflow-y: auto;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3); position: relative;
        }

        .modal-close {
            position: absolute; top: 15px; right: 20px; font-size: 24px;
            font-weight: bold; cursor: pointer; color: #888;
        }
        .modal-close:hover { color: #000; }

        .stats-summary {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px; margin-bottom: 25px; margin-top: 15px;
        }

        .records-section {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px; margin-bottom: 25px;
        }

        .record-card {
            background: #f4f9f5; border: 1px solid #d2e7d6; border-radius: 8px;
            padding: 15px; text-align: center;
        }
        .record-card h4 { margin: 0; font-size: 12px; color: #2e7d32; text-transform: uppercase; }
        .record-card .value { font-size: 20px; font-weight: bold; color: #1b5e20; margin-top: 5px; }
        .record-card .subtext { font-size: 11px; color: #555; margin-top: 4px; word-break: break-word; }

        .stat-card {
            background: #fdf6f2; border: 1px solid #f0e0d5; border-radius: 8px;
            padding: 15px; text-align: center;
        }
        .stat-card h4 { margin: 0; font-size: 12px; color: #666; text-transform: uppercase; }
        .stat-card .value { font-size: 24px; font-weight: bold; color: #ff6600; margin-top: 5px; }

        .chart-container {
            margin-bottom: 25px; position: relative; height: 260px;
        }

        /* Koordinatvisning för admin */
        .admin-coord-display {
            position: absolute; bottom: 25px; left: 20px;
            background: rgba(255, 255, 255, 0.95); padding: 12px; z-index: 1000;
            border: 2px solid #ff6600; border-radius: 8px; font-size: 13px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* Popup styling */
        .ol-popup { min-width: 280px; }
        .ol-popup h3 { margin: 0 0 2px 0; color: #333; font-size: 18px; }
        .ol-popup p.meta { margin: 0 0 12px 0; font-size: 12px; color: #666; border-bottom: 1px solid #eee; padding-bottom: 6px; }
        
        .btn-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
        .btn {
            display: block; text-align: center; padding: 10px;
            border-radius: 4px; text-decoration: none; color: white;
            font-weight: bold; font-size: 13px; transition: background 0.2s;
        }
        .btn-pdf { background-color: #e74c3c; }
        .btn-winsplits { background-color: #3498db; }
        .btn-livelox { background-color: #2ecc71; }
        .btn:hover { filter: brightness(90%); }

        .btn-disabled {
            background-color: #bdc3c7 !important;
            color: #7f8c8d !important;
            cursor: not-allowed !important;
            pointer-events: none !important;
            user-select: none !important;
            box-shadow: none !important;
        }

        .referat-box {
            max-height: 200px; overflow-y: auto; background: #fdf6f2;
            padding: 12px; border: 1px solid #f0e0d5; border-radius: 4px;
            font-size: 13px; line-height: 1.5; color: #444; white-space: pre-wrap;
        }

        .ol-icon {
            background: transparent !important; border: none !important; overflow: visible !important;
        }

        .ol-icon-inner {
            width: 20px; height: 20px;
            background: linear-gradient(135deg, #ffffff 50%, #ff6600 50%);
            border: 1.5px solid #333; box-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .ol-icon-year {
            position: absolute; top: 23px; left: 50%;
            transform: translateX(-50%); background: white;
            border: 1px solid #333; border-radius: 3px;
            padding: 1px 4px; font-size: 10px; font-weight: bold;
            color: #333; white-space: nowrap;
            box-shadow: 1px 1px 3px rgba(0,0,0,0.25); z-index: 1000;
        }

        .marker-cluster-small, .marker-cluster-medium, .marker-cluster-large {
            background-color: rgba(255, 102, 0, 0.6);
        }
        .marker-cluster-small div, .marker-cluster-medium div, .marker-cluster-large div {
            background-color: rgba(255, 102, 0, 0.8); color: white; font-weight: bold;
        }

        @media (max-width: 600px) {
            .admin-coord-display { display: none; }
        }
    </style>
</head>
<body>

    <div id="filter-container">
        <div class="filter-group">
            <label for="name-search">Sök tävling:</label>
            <input type="text" id="name-search" placeholder="T.ex. O-Ringen..." oninput="filterMarkers()">
        </div>
        <div class="filter-group">
            <label for="year-filter">Välj år:</label>
            <select id="year-filter" onchange="filterMarkers()">
                <option value="all">Alla år</option>
            </select>
        </div>
        <div class="filter-group">
            <label for="organizer-filter">Välj arrangör:</label>
            <select id="organizer-filter" onchange="filterMarkers()">
                <option value="all">Alla arrangörer</option>
            </select>
        </div>
        <button class="stats-btn" onclick="openStatsModal()">📊 Visa statistik</button>
        <div class="result-count">
            Visar <span id="count-number">0</span> kartor
        </div>
    </div>

    <!-- Modal för Statistik -->
    <div class="modal-overlay" id="stats-modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeStatsModal()">&times;</span>
            <h2 style="margin-top:0; color:#ff6600;">Statistik & Översikt</h2>
            
            <div class="stats-summary">
                <div class="stat-card">
                    <h4>Totalt antal tävlingar</h4>
                    <div class="value" id="stat-total-races">0</div>
                </div>
                <div class="stat-card">
                    <h4>Total sträcka</h4>
                    <div class="value" id="stat-total-dist">0 km</div>
                </div>
                <div class="stat-card">
                    <h4>Medeldistans per tävling</h4>
                    <div class="value" id="stat-avg-dist">0 km</div>
                </div>
            </div>

            <h3>🏆 Personliga Rekord</h3>
            <div class="records-section">
                <div class="record-card">
                    <h4>Längsta Lopp</h4>
                    <div class="value" id="rec-longest-dist">0 km</div>
                    <div class="subtext" id="rec-longest-name">-</div>
                </div>
                <div class="record-card">
                    <h4>Mesta Tävlingar / År</h4>
                    <div class="value" id="rec-most-races-count">0</div>
                    <div class="subtext" id="rec-most-races-year">-</div>
                </div>
                <div class="record-card">
                    <h4>Mesta Sträcka / År</h4>
                    <div class="value" id="rec-most-dist-km">0 km</div>
                    <div class="subtext" id="rec-most-dist-year">-</div>
                </div>
            </div>

            <h3>Tävlingar per år</h3>
            <div class="chart-container">
                <canvas id="racesChart"></canvas>
            </div>

            <h3>Sprungen sträcka per år (km)</h3>
            <div class="chart-container">
                <canvas id="distanceChart"></canvas>
            </div>
        </div>
    </div>

    <div id="map"></div>
    
    <div class="admin-coord-display" id="coords">
        Klicka på kartan för koordinater
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script>
        const csvBaseUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTiIvWU6vJ_oiLei4yVUVRjROhqhDOUVxE5H796BTNBHbRRXz6tgMtL777NatJMlHkyF1oXKknvMEDk/pub?output=csv';
        const csvUrl = csvBaseUrl + '&t=' + new Date().getTime();

        const map = L.map('map').setView([62.0, 15.0], 5);
        
        const cartoLight = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap, © CARTO'
        });
        const osmStandard = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap-bidragsgivare'
        });
        const esriSatellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles © Esri'
        });

        osmStandard.addTo(map);

        L.control.layers({
            "Gatukarta": osmStandard,
            "Ljus karta": cartoLight,
            "Satellit": esriSatellite
        }, null, { position: 'topleft' }).addTo(map);

        const markersGroup = L.markerClusterGroup({
            showCoverageOnHover: false,
            spiderfyOnMaxZoom: true,
            disableClusteringAtZoom: 17
        });

        function createYearIcon(year) {
            return L.divIcon({
                className: 'ol-icon',
                html: `<div class="ol-icon-inner"></div><div class="ol-icon-year">${year || ''}</div>`,
                iconSize: [20, 20], iconAnchor: [10, 10]
            });
        }

        function getButtonHtml(url, label, activeClass) {
            const cleanUrl = url ? String(url).trim() : "";
            const hasValidUrl = cleanUrl.startsWith("http://") || cleanUrl.startsWith("https://");

            if (hasValidUrl) {
                return `<a href="${cleanUrl}" target="_blank" class="btn ${activeClass}">${label}</a>`;
            } else {
                return `<span class="btn btn-disabled">${label} (saknas)</span>`;
            }
        }

        // Flexibel funktion som söker efter kolumner oavsett exakt namn eller extra tecken
        function getValue(row, keyAliases) {
            if (!row) return "";
            for (const key of Object.keys(row)) {
                const cleanKey = key.trim().replace(/^\uFEFF/, '').toLowerCase();
                for (const alias of keyAliases) {
                    const cleanAlias = alias.toLowerCase();
                    if (cleanKey === cleanAlias || cleanKey.includes(cleanAlias)) {
                        return row[key] !== undefined && row[key] !== null ? String(row[key]).trim() : "";
                    }
                }
            }
            return "";
        }

        function parseCoord(val) {
            if (!val) return NaN;
            const clean = String(val).replace(',', '.').replace(/[^\d.-]/g, '');
            return parseFloat(clean);
        }

        let allMarkersList = [];
        let filteredParsedData = [];
        let racesChartInstance = null;
        let distanceChartInstance = null;

        async function loadData() {
            Papa.parse(csvUrl, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    const yearFilterMenu = document.getElementById('year-filter');
                    const organizerFilterMenu = document.getElementById('organizer-filter');
                    const yearsFound = new Set();
                    const organizersFound = new Set();

                    results.data.forEach(row => {
                        const namn = getValue(row, ["namn", "tävling", "tavling", "race", "name"]);
                        const rawYear = getValue(row, ["år", "ar", "year", "datum", "date"]);
                        const ar = parseInt(rawYear, 10);
                        const arrangor = getValue(row, ["arrangör", "arrangor", "klubb", "club", "organizer"]);
                        const rawLangd = getValue(row, ["längd", "langd", "distans", "distance", "m"]);
                        const tid = getValue(row, ["tid", "time"]);
                        const rawLat = getValue(row, ["latitud", "lat", "latitude", "y"]);
                        const rawLng = getValue(row, ["longitud", "long", "lng", "longitude", "x"]);
                        const referat = getValue(row, ["referat", "kommentar", "notering"]) || "Inget referat skrivet.";
                        const pdf = getValue(row, ["pdf_url", "pdf", "karta", "map"]);
                        const winsplits = getValue(row, ["splits_url", "splits", "winsplits"]);
                        const livelox = getValue(row, ["route_url", "livelox", "route"]);

                        const lat = parseCoord(rawLat);
                        const lng = parseCoord(rawLng);
                        
                        const cleanLangdStr = rawLangd.replace(',', '.').replace(/[^\d.]/g, '');
                        const langdNum = parseFloat(cleanLangdStr);
                        const langd = !isNaN(langdNum) ? langdNum : 0;

                        const displayYear = !isNaN(ar) ? ar : "";

                        const item = {
                            namn, ar: displayYear, arrangor, langd, tid, lat, lng, referat, pdf, winsplits, livelox
                        };

                        if (!isNaN(lat) && !isNaN(lng)) {
                            const marker = L.marker([lat, lng], { icon: createYearIcon(displayYear) });
                            
                            const popupContent = `
                                <div class="ol-popup">
                                    <h3>${namn}</h3>
                                    <p class="meta">
                                        <strong>${displayYear}</strong> | ${arrangor} | ${langd > 0 ? langd + 'm' : ''} ${tid ? '| ' + tid : ''}
                                    </p>
                                    <div class="btn-group">
                                        ${getButtonHtml(pdf, 'Karta (PDF)', 'btn-pdf')}
                                        ${getButtonHtml(winsplits, 'Split Times', 'btn-winsplits')}
                                        ${getButtonHtml(livelox, 'Route', 'btn-livelox')}
                                    </div>
                                    <div class="referat-box">${referat}</div>
                                </div>
                            `;
                            
                            marker.bindPopup(popupContent, { maxWidth: 350 });
                            marker.year = String(displayYear);
                            marker.arrangor = String(arrangor);
                            marker.namn = String(namn).toLowerCase();
                            marker.itemData = item;
                            
                            allMarkersList.push(marker);

                            if(displayYear) yearsFound.add(displayYear);
                            if(arrangor) organizersFound.add(arrangor);
                        }
                    });

                    const sortedYearsList = Array.from(yearsFound).sort((a, b) => b - a);

                    sortedYearsList.forEach(year => {
                        const opt = document.createElement('option');
                        opt.value = year; opt.innerHTML = year;
                        yearFilterMenu.appendChild(opt);
                    });

                    Array.from(organizersFound).sort((a, b) => a.localeCompare(b, 'sv')).forEach(org => {
                        const opt = document.createElement('option');
                        opt.value = org; opt.innerHTML = org;
                        organizerFilterMenu.appendChild(opt);
                    });

                    map.addLayer(markersGroup);
                    filterMarkers();
                }
            });
        }

        function filterMarkers(autoZoom = true) {
            const selectedYear = document.getElementById('year-filter').value;
            const selectedOrganizer = document.getElementById('organizer-filter').value;
            const searchText = document.getElementById('name-search').value.toLowerCase().trim();
            
            markersGroup.clearLayers();
            filteredParsedData = [];
            let visibleCount = 0;
            
            allMarkersList.forEach(marker => {
                const matchesYear = (selectedYear === "all" || marker.year === selectedYear);
                const matchesOrganizer = (selectedOrganizer === "all" || marker.arrangor === selectedOrganizer);
                const matchesSearch = (searchText === "" || marker.namn.includes(searchText));

                if (matchesYear && matchesOrganizer && matchesSearch) {
                    markersGroup.addLayer(marker);
                    filteredParsedData.push(marker.itemData);
                    visibleCount++;
                }
            });

            document.getElementById('count-number').textContent = visibleCount;

            if (visibleCount > 0 && autoZoom) {
                map.fitBounds(markersGroup.getBounds(), {
                    padding: [60, 60],
                    maxZoom: 13,
                    animate: true,
                    duration: 0.8
                });
            }

            if (document.getElementById('stats-modal').style.display === 'flex') {
                calculateAndRenderStats();
            }
        }

        /* Statistik-funktioner */
        function openStatsModal() {
            document.getElementById('stats-modal').style.display = 'flex';
            calculateAndRenderStats();
        }

        function closeStatsModal() {
            document.getElementById('stats-modal').style.display = 'none';
        }

        function calculateAndRenderStats() {
            const yearlyData = {};
            let totalDistMeters = 0;
            let totalRacesWithDist = 0;

            let longestRace = { dist: 0, name: "-", year: "" };

            filteredParsedData.forEach(item => {
                const year = item.ar;
                if (!year || isNaN(year)) return;

                if (!yearlyData[year]) {
                    yearlyData[year] = { count: 0, distance: 0 };
                }

                yearlyData[year].count += 1;
                if (item.langd > 0) {
                    yearlyData[year].distance += item.langd;
                    totalDistMeters += item.langd;
                    totalRacesWithDist += 1;

                    if (item.langd > longestRace.dist) {
                        longestRace = { dist: item.langd, name: item.namn, year: item.ar };
                    }
                }
            });

            const sortedYears = Object.keys(yearlyData).sort((a, b) => a - b);
            const raceCounts = sortedYears.map(y => yearlyData[y].count);
            const distancesKm = sortedYears.map(y => (yearlyData[y].distance / 1000).toFixed(1));

            // Rekordberäkningar
            let maxRacesInYear = { count: 0, year: "-" };
            let maxDistInYear = { dist: 0, year: "-" };

            sortedYears.forEach(y => {
                if (yearlyData[y].count > maxRacesInYear.count) {
                    maxRacesInYear = { count: yearlyData[y].count, year: y };
                }
                if (yearlyData[y].distance > maxDistInYear.dist) {
                    maxDistInYear = { dist: yearlyData[y].distance, year: y };
                }
            });

            const totalRaces = filteredParsedData.length;
            const totalKm = (totalDistMeters / 1000).toFixed(1);
            const avgKm = totalRacesWithDist > 0 ? (totalDistMeters / totalRacesWithDist / 1000).toFixed(1) : 0;

            // Uppdatera summering
            document.getElementById('stat-total-races').textContent = totalRaces;
            document.getElementById('stat-total-dist').textContent = totalKm + ' km';
            document.getElementById('stat-avg-dist').textContent = avgKm + ' km';

            // Uppdatera rekord
            document.getElementById('rec-longest-dist').textContent = longestRace.dist > 0 ? (longestRace.dist / 1000).toFixed(2) + ' km' : '0 km';
            document.getElementById('rec-longest-name').textContent = longestRace.dist > 0 ? `${longestRace.name} (${longestRace.year})` : '-';

            document.getElementById('rec-most-races-count').textContent = maxRacesInYear.count > 0 ? maxRacesInYear.count + ' tävlingar' : '0';
            document.getElementById('rec-most-races-year').textContent = maxRacesInYear.count > 0 ? `År ${maxRacesInYear.year}` : '-';

            document.getElementById('rec-most-dist-km').textContent = maxDistInYear.dist > 0 ? (maxDistInYear.dist / 1000).toFixed(1) + ' km' : '0 km';
            document.getElementById('rec-most-dist-year').textContent = maxDistInYear.dist > 0 ? `År ${maxDistInYear.year}` : '-';

            renderCharts(sortedYears, raceCounts, distancesKm);
        }

        function renderCharts(labels, raceData, distanceData) {
            if (racesChartInstance) racesChartInstance.destroy();
            if (distanceChartInstance) distanceChartInstance.destroy();

            const ctxRaces = document.getElementById('racesChart').getContext('2d');
            racesChartInstance = new Chart(ctxRaces, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Antal tävlingar',
                        data: raceData,
                        backgroundColor: '#ff6600',
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
                }
            });

            const ctxDist = document.getElementById('distanceChart').getContext('2d');
            distanceChartInstance = new Chart(ctxDist, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Totalt km',
                        data: distanceData,
                        backgroundColor: '#3498db',
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true } }
                }
            });
        }

        map.on('click', function(e) {
            document.getElementById('coords').innerHTML = 
                `<strong>Admin-koordinater:</strong><br>Lat: ${e.latlng.lat.toFixed(6)}<br>Long: ${e.latlng.lng.toFixed(6)}`;
        });

        loadData();
    </script>
</body>
</html>
